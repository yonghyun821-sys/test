experiment:
  name: aegis-whowhen-gpt5-merge-gemini25flash-main
  research_question: How does taxonomy guidance affect the accuracy of agent failure attribution when the native output label space is held constant?
  main_sample_id: sample-b7d4cd5fad781ef7
  expected_aegis_n: 97
  expected_whowhen_n: 500
  expected_total_n: 597
  expected_prediction_rows: 2388
  main_seed: 20260907
  merge_seed: 20260908
  pilot_seed: 20260908
  conditions:
    - label_only
    - own_taxonomy
    - foreign_taxonomy
    - merged_taxonomy

models:
  merge:
    name: openai/gpt-5
    temperature: null
    reasoning_effort: medium
    max_output_tokens: 16000
    context_window: 400000
    tokenizer_encoding: o200k_base
    max_tokens_parameter: max_tokens
    provider:
      order:
        - openai
    pricing_usd_per_million:
      input: 1.25
      output: 10.00

attribution_model:
  name: google/gemini-2.5-flash
  temperature: 0
  max_output_tokens: 700
  context_window: 1048576
  tokenizer_encoding: o200k_base
  pricing_usd_per_million:
    input: 0.30
    output: 2.50
  provider:
    order:
      - google-vertex

api:
  api_key_env: AEGIS_WHOWHEN_GPT5_FLASH_MAIN_OPENROUTER_API_KEY
  base_url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  app_title: aegis-whowhen-gpt5-merge-gemini25flash-main
  http_referer_env: OPENROUTER_HTTP_REFERER
  max_retries: 3
  timeout_seconds: 180
  provider_defaults:
    allow_fallbacks: false
    require_parameters: true
    data_collection: deny

cost_budget:
  max_total_charge_usd: 50.00
  max_inference_usd: 50.00
  ledger_baseline_usd: 0.0
  budget_epoch_name: aegis-whowhen-gpt5-merge-gemini25flash-main-v1
  input_token_safety_multiplier: 1.50
  ledger_path: experiments/aegis_whowhen_gpt5_merge_gemini25flash_main/runtime/merge_api_ledger.jsonl

execution:
  api_key_envs:
    - AEGIS_WHOWHEN_GPT5_FLASH_MAIN_OPENROUTER_API_KEY
  hard_cost_cap_usd: 50.0
  progress_every: 10
  systematic_failure_consecutive_rows: 8
  merge_validation_retries: 2

analysis:
  bootstrap_resamples: 20000
  bootstrap_seed: 20260908
  alpha: 0.05

