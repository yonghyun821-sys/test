[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonomy-cross-application"
version = "0.1.0"
description = "Reproducible AgentRx/MAST taxonomy cross-application experiment"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.38.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
